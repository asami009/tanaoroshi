<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="棚卸">
<meta name="theme-color" content="#f6f3ee">
<title>日用品の棚卸</title>
<style>
  :root{
    --bg:#f6f3ee; --card:#fff; --ink:#22201d; --sub:#7a746c; --line:#e3ddd3;
    --red:#d63a2f; --red-bg:#fdecea; --green:#2f7d4f; --green-bg:#e8f4ec;
    --shadow:0 2px 0 #ddd5c8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    font-size:16px;line-height:1.5}
  body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
  button,.item{touch-action:manipulation}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,select{font:inherit;font-size:16px}

  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    border-bottom:1px solid var(--line)}
  .hrow{display:flex;align-items:center;gap:10px}
  .hrow h1{font-size:18px;margin:0;flex:1;font-weight:700}
  .hint{margin:4px 0 0;font-size:13px;color:var(--sub)}
  .chip{padding:7px 12px;border-radius:999px;border:1.5px solid var(--ink);font-size:14px;font-weight:700;background:var(--card);box-shadow:var(--shadow)}
  .chip:active{transform:translateY(2px);box-shadow:none}
  .chip.on{background:var(--ink);color:#fff}

  main{padding:12px 16px}
  .genre{margin:0 0 16px}
  .ghead{display:flex;align-items:center;gap:8px;margin:0 0 8px}
  .ghead h2{font-size:14px;color:var(--sub);margin:0;flex:1;font-weight:700;letter-spacing:.05em}
  .items{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}

  .item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;min-height:50px;
    background:var(--card);border:1.5px solid var(--line);border-radius:12px;box-shadow:var(--shadow);transition:background .12s,border-color .12s}
  .item:active{transform:translateY(2px);box-shadow:none}
  .item .box{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid #b9b1a5;display:grid;place-items:center}
  .item .nm{flex:1;font-size:16px}
  .item .tag{font-size:12px;font-weight:700;color:var(--red);display:none;flex:none}
  .item.need{background:var(--red-bg);border-color:var(--red)}
  .item.need .box{background:var(--red);border-color:var(--red)}
  .item.need .box::after{content:"";width:12px;height:3px;background:#fff;border-radius:2px}
  .item.need .tag{display:inline}

  /* 買い物リスト画面 */
  .shop .item .box{border-color:var(--green)}
  .shop .item.gone{opacity:0;transform:translateX(40px);transition:opacity .25s,transform .25s}
  .empty{text-align:center;padding:48px 16px;color:var(--sub)}
  .empty b{display:block;font-size:20px;color:var(--ink);margin-bottom:6px}
  .done-list{margin-top:22px}
  .done-list summary{font-size:14px;color:var(--sub);padding:8px 0;cursor:pointer}
  .done-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);color:var(--sub)}
  .done-row span{flex:1;text-decoration:line-through}
  .linkbtn{color:var(--ink);font-size:14px;font-weight:700;text-decoration:underline;padding:6px}

  /* 編集モード */
  .erow{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card);border:1.5px solid var(--line);border-radius:12px}
  .erow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ncol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
  .ncol .ren{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prbtn{font-size:13px;color:var(--sub);padding:7px 0;text-decoration:underline dotted #b9b1a5;text-underline-offset:3px}
  .prbtn::after{content:" ✎";font-size:12px}
  .srow{display:flex;gap:8px;min-width:0}
  .srow .item{flex:1;min-width:0}
  .spr{flex:none;min-width:84px;padding:0 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:14px;color:var(--ink)}
  .spr small{display:block;font-size:11px;color:var(--sub)}
  .spr:active{transform:translateY(2px);box-shadow:none}
  .shop .srow.gone{opacity:0;transform:translateX(40px);transition:opacity .25s,transform .25s}
  .total{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 16px}
  .total div{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:10px 12px}
  .total div:first-child{background:var(--green-bg);border-color:var(--green)}
  .total span{display:block;font-size:12px;color:var(--sub);font-weight:700}
  .total b{font-size:22px}
  .total p{grid-column:1/-1;margin:0;font-size:12px;color:var(--sub)}
  .erow .ren{text-align:left;padding:6px 0;text-decoration:underline dotted #b9b1a5;text-underline-offset:4px}
  .erow .ren::after{content:" ✎";color:var(--sub);font-size:13px}
  .erow select{flex:none;width:104px;padding:6px 4px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .xbtn{flex:none;width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:18px;line-height:1;color:var(--red)}
  .xbtn:active{background:var(--red-bg)}
  .small{font-size:13px;font-weight:700;padding:6px 10px;border-radius:8px;border:1.5px solid var(--line);background:#fff}
  .small:active{background:var(--line)}
  .addrow{display:flex;gap:8px;margin-top:8px}
  .addrow input{flex:1;min-width:0;padding:10px 12px;border:1.5px dashed #b9b1a5;border-radius:12px;background:transparent}
  .addrow input:focus{outline:none;border-style:solid;border-color:var(--ink);background:#fff}
  .addrow button{padding:0 14px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700}
  .addgenre{margin-top:6px;padding:16px;border:1.5px dashed #b9b1a5;border-radius:14px}
  .addgenre p{margin:0 0 4px;font-size:14px;font-weight:700}

  .reset{display:block;width:100%;margin:8px 0 0;padding:16px;border-radius:14px;border:2px solid var(--ink);background:var(--card);
    font-weight:700;font-size:16px;box-shadow:0 3px 0 var(--ink)}
  .reset:active{transform:translateY(3px);box-shadow:none}
  .reset small{display:block;font-weight:400;font-size:12px;color:var(--sub)}

  .a2hs{margin:12px 16px 0;padding:12px 14px;border:2px solid var(--red);border-radius:12px;background:var(--red-bg);font-size:14px}
  .a2hs b{display:block;margin-bottom:4px}
  .a2hs .kbd{display:inline-block;padding:0 6px;border:1px solid var(--sub);border-radius:5px;background:#fff;font-size:13px}
  .a2hs button{display:block;margin-top:8px;padding:8px 14px;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;font-size:14px}
  .a2hs.today{border-color:var(--green);background:var(--green-bg)}
  .a2hs.today b{font-size:17px}

  /* 棚卸の日の設定（編集画面のいちばん下） */
  .setbox{margin:24px 0 0;padding:14px 16px;background:var(--card);border:1.5px solid var(--line);border-radius:14px}
  .setbox h2{font-size:14px;color:var(--sub);margin:0 0 8px;font-weight:700;letter-spacing:.05em}
  .dayrow{display:flex;align-items:center;gap:8px;font-weight:700}
  .dayrow select{width:84px;padding:8px 6px;border:1.5px solid var(--ink);border-radius:10px;background:#fff;font-weight:700}
  .setbox p{margin:8px 0 0;font-size:13px;color:var(--sub)}

  /* 使い方（吹き出し） */
  .tour{position:fixed;inset:0;z-index:30}
  .tour-spot{position:fixed;border-radius:14px;box-shadow:0 0 0 200vmax rgba(20,18,15,.62);pointer-events:none;
    transition:left .25s,top .25s,width .25s,height .25s}
  .tour-box{position:fixed;background:var(--card);color:var(--ink);border-radius:14px;padding:14px 16px 12px;
    box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:15px}
  .tour-box::before{content:"";position:absolute;left:var(--ax,50%);width:14px;height:14px;background:var(--card);transform:translateX(-50%) rotate(45deg)}
  .tour-box.up::before{top:-7px}
  .tour-box.down::before{bottom:-7px}
  .tour-box.mid::before{display:none}
  .tour-box p{margin:0}
  .tour-foot{display:flex;align-items:center;gap:8px;margin-top:12px}
  .tour-foot span{flex:1;font-size:13px;color:var(--sub)}
  .tour-foot .skip{padding:8px 10px;font-size:14px;color:var(--sub);text-decoration:underline}
  .tour-foot .next{padding:9px 18px;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;font-size:15px;box-shadow:0 3px 0 #000}
  .tour-foot .next:active{transform:translateY(3px);box-shadow:none}

  /* 下のタブ */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:1fr 1fr;gap:8px;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
  nav button{padding:12px 6px;border-radius:14px;border:2px solid var(--ink);background:var(--card);font-weight:700;font-size:15px;
    box-shadow:0 3px 0 var(--ink);position:relative}
  nav button:active{transform:translateY(3px);box-shadow:none}
  nav button.cur{background:var(--ink);color:#fff}
  nav .badge[hidden]{display:none}
  nav .badge{display:inline-block;min-width:22px;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:13px;line-height:22px}

  .toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:10px 12px 10px 16px;border-radius:12px;display:flex;align-items:center;gap:12px;
    opacity:0;pointer-events:none;transition:.2s;font-size:14px;max-width:calc(100vw - 24px);z-index:9}
  #toastMsg{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toast button{flex:none}
  .toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .toast button{color:#ffd84d;font-weight:700;text-decoration:underline;padding:4px}
</style>
</head>
<body ontouchstart="">

<header>
  <div class="hrow">
    <h1 id="title">家で棚卸</h1>
    <button class="chip" id="editBtn" type="button">品目を編集 ›</button>
  </div>
  <p class="hint" id="hint">足りない物をタップ → 赤くなる</p>
</header>

<div class="a2hs today" id="dayBand" hidden>
  <b>今日は棚卸の日！</b>
  いちばん下の「棚卸を始める」でまっさらにしてから、足りない物をタップしてね
  <button type="button" id="dayBandClose">わかった</button>
</div>
<div class="a2hs" id="a2hs" hidden>
  <b>ホーム画面に追加して、アイコンから開いてね</b>
  Safariのまま使うと、しばらく開かない間に足した品目が消えることがあるよ。<br>下の<span class="kbd">共有</span>ボタン →「ホーム画面に追加」
  <button type="button" id="a2hsClose">わかった</button>
</div>
<main id="main"></main>

<nav>
  <button type="button" id="tabHome" class="cur">家で棚卸</button>
  <button type="button" id="tabShop">買い物リスト<span class="badge" id="badge" hidden>0</span></button>
</nav>

<div class="toast" id="toast"><span id="toastMsg"></span><button type="button" id="toastUndo">取り消し</button></div>

<div class="tour" id="tour" hidden>
  <div class="tour-spot" id="tourSpot"></div>
  <div class="tour-box" id="tourBox" role="dialog" aria-live="polite">
    <p id="tourText"></p>
    <div class="tour-foot"><span id="tourNum"></span><button type="button" class="skip" id="tourSkip">とばす</button><button type="button" class="next" id="tourNext">次へ</button></div>
  </div>
</div>

<script>
const KEY = 'tanaoroshi.v1';
let tour = null; // 使い方を見せている間だけ { i, real, el }。その間は保存しない
const DEFAULT = [
  ['トイレ', ['トイレットペーパー','トイレ用洗剤','トイレ用おそうじシート','ブルーレット','ナプキン']],
  ['お風呂・洗面', ['シャンプー','コンディショナー','ボディソープ','歯ブラシ','歯磨き粉','お風呂の防カビ剤']],
  ['洗濯', ['洗濯洗剤','柔軟剤']],
  ['キッチン', ['食器用洗剤','スポンジ','ゴミ袋','キッチンペーパー','キッチンハイター','ラップ','ジップ袋','アルミホイル']],
  ['掃除', ['消臭剤','お風呂用洗剤','カビ取り剤','メラミンスポンジ']],
  ['その他', ['ティッシュ']],
];
/* 値段の目安（2026-10-13 調べ。ネット最安くらい・トイペは店の値段）。使い始めたスマホにも1回だけ入れる */
const PRICE = { 'トイレットペーパー':1480,'トイレ用洗剤':360,'トイレ用おそうじシート':328,'ブルーレット':399,'ナプキン':1840,
  'シャンプー':880,'コンディショナー':988,'ボディソープ':1260,'歯ブラシ':944,'歯磨き粉':500,'お風呂の防カビ剤':600,
  '洗濯洗剤':2499,'柔軟剤':700,'食器用洗剤':630,'スポンジ':402,'ゴミ袋':600,'キッチンペーパー':420,'キッチンハイター':564,
  'ラップ':196,'ジップ袋':243,'アルミホイル':173,'消臭剤':650,'お風呂用洗剤':858,'カビ取り剤':300,'ティッシュ':398 };
let seq = Date.now();
const uid = () => (seq++).toString(36);

function fresh(){
  return { priceV1: true, settings: { day: 20 }, genres: DEFAULT.map(([name, items]) => ({ id: uid(), name, items: items.map(n => ({ id: uid(), name: n, need: false, bought: false, price: PRICE[n] ?? null })) })) };
}
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.genres) && s.genres.every(g => g && typeof g.name === 'string' && Array.isArray(g.items) && g.items.every(i => i && typeof i.name === 'string'))) return s; } catch(e){}
  return fresh();
}
let data = load();
/* 1項目にまとめていた物を分ける・名前を直す（2026-10-13・使い始めたスマホにも効かせる） */
const SPLIT = { 'ラップ・ジップ袋・アルミホイル': ['ラップ','ジップ袋','アルミホイル'], 'トイレットペーパー（3倍巻き）': ['トイレットペーパー'], 'タンクの上に置くやつ（ブルーレット系）': ['ブルーレット'] };
data.genres.forEach(g => {
  for (let k = g.items.length - 1; k >= 0; k--) {
    const it = g.items[k], parts = SPLIT[it.name];
    if (parts) g.items.splice(k, 1, ...parts.map(n => ({ id: uid(), name: n, need: it.need, bought: it.bought, price: it.price ?? PRICE[n] ?? null })));
  }
});
if (!data.priceV1) {
  data.genres.forEach(g => g.items.forEach(i => { if (i.price == null && PRICE[i.name] != null) i.price = PRICE[i.name]; }));
  data.priceV1 = true;
}
/* 棚卸の日（2026-10-14追加）。前からのデータには無いので毎月20日で入れる */
if (!data.settings || typeof data.settings !== 'object') data.settings = {};
if (!(Number.isInteger(data.settings.day) && data.settings.day >= 1 && data.settings.day <= 31)) data.settings.day = 20;
save();
function save(){ if (tour) return; try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){} }

let view = 'home';   // home | shop
let editing = false;
let doneOpen = false; // 「カゴに入れた物」を開いたままにする

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const findItem = id => { for (const g of data.genres) { const it = g.items.find(i => i.id === id); if (it) return [g, it]; } return [null, null]; };
const yen = n => '約' + (Math.round(n / 10) * 10).toLocaleString('ja-JP') + '円';
const needCount = () => data.genres.reduce((n, g) => n + g.items.filter(i => i.need && !i.bought).length, 0);
const invDay = () => data.settings.day;

function render(){
  $('tabHome').classList.toggle('cur', view === 'home');
  $('tabShop').classList.toggle('cur', view === 'shop');
  const n = needCount();
  $('badge').hidden = n === 0; $('badge').textContent = n;
  $('editBtn').hidden = view !== 'home';
  $('editBtn').classList.toggle('on', editing);
  $('editBtn').textContent = editing ? '編集おわり ✓' : '品目を編集 ›';

  if (view === 'home') {
    $('title').textContent = editing ? '品目を編集' : '家で棚卸';
    $('hint').textContent = editing ? '名前・値段をタップで変える・× で消す・右の欄でジャンルを移す' : '足りない物をタップ → 赤くなる（もう一回で戻る）';
    $('main').className = '';
    $('main').innerHTML = editing ? editHTML() : homeHTML();
  } else {
    $('title').textContent = '買い物リスト';
    $('hint').textContent = 'カゴに入れたら品目をタップ → 消える';
    $('main').className = 'shop';
    $('main').innerHTML = shopHTML();
  }
}

function homeHTML(){
  let h = data.genres.map(g => `
    <section class="genre">
      <div class="ghead"><h2>${esc(g.name)}</h2></div>
      <div class="items">${g.items.map(i => `
        <button type="button" class="item${i.need && !i.bought ? ' need' : ''}" data-act="toggle" data-id="${i.id}">
          <span class="box"></span><span class="nm">${esc(i.name)}</span><span class="tag">足りない</span>
        </button>`).join('') || '<p class="hint">まだ品目がないよ。「品目を編集」から足してね</p>'}
      </div>
    </section>`).join('');
  h += `<button type="button" class="reset" data-act="reset">棚卸を始める（毎月${invDay()}日）<small>赤と買い物リストを全部まっさらにする</small></button>`;
  return h;
}

function shopHTML(){
  const groups = data.genres.map(g => ({ g, list: g.items.filter(i => i.need && !i.bought) })).filter(x => x.list.length);
  const done = [];
  data.genres.forEach(g => g.items.forEach(i => { if (i.need && i.bought) done.push(i); }));
  const all = data.genres.flatMap(g => g.items.filter(i => i.need));
  const sum = list => list.reduce((n, i) => n + (i.price || 0), 0);
  const left = all.filter(i => !i.bought), noPrice = all.filter(i => i.price == null).length;
  let h = all.length ? `<div class="total">
      <div><span>残り</span><b>${yen(sum(left))}</b></div>
      <div><span>合計</span><b>${yen(sum(all))}</b></div>
      <p>値段は目安。右の値段をタップで直せる${noPrice ? `・値段なし${noPrice}個は入ってない` : ''}</p>
    </div>` : '';
  if (!groups.length) {
    h += done.length
      ? `<div class="empty"><b>ぜんぶカゴに入った！</b>おつかれさま〜</div>`
      : `<div class="empty"><b>買う物はないよ</b>「家で棚卸」で足りない物をタップすると、ここに出てくる</div>`;
  } else {
    h += groups.map(({ g, list }) => `
      <section class="genre">
        <div class="ghead"><h2>${esc(g.name)}</h2></div>
        <div class="items">${list.map(i => `
          <div class="srow"><button type="button" class="item" data-act="buy" data-id="${i.id}">
            <span class="box"></span><span class="nm">${esc(i.name)}</span>
          </button><button type="button" class="spr" data-act="priceI" data-id="${i.id}">${i.price != null ? i.price.toLocaleString('ja-JP') + '円' : '値段'}<small>✎</small></button></div>`).join('')}
        </div>
      </section>`).join('');
  }
  if (done.length) {
    h += `<details class="done-list"${doneOpen ? ' open' : ''}><summary>カゴに入れた物（${done.length}）</summary>${done.map(i => `
      <div class="done-row"><span>${esc(i.name)}</span><button type="button" class="linkbtn" data-act="unbuy" data-id="${i.id}">戻す</button></div>`).join('')}</details>`;
  }
  return h;
}

function editHTML(){
  const opts = cur => data.genres.map(g => `<option value="${g.id}"${g.id === cur ? ' selected' : ''}>${esc(g.name)}</option>`).join('');
  let h = data.genres.map(g => `
    <section class="genre">
      <div class="ghead">
        <h2>${esc(g.name)}</h2>
        <button type="button" class="small" data-act="renameG" data-id="${g.id}">名前を変える</button>
        <button type="button" class="small" data-act="delG" data-id="${g.id}" style="color:var(--red)">ジャンルを消す</button>
      </div>
      <div class="items">${g.items.map(i => `
        <div class="erow">
          <div class="ncol"><button type="button" class="ren" data-act="renameI" data-id="${i.id}">${esc(i.name)}</button>
          <button type="button" class="prbtn" data-act="priceI" data-id="${i.id}">${i.price != null ? i.price.toLocaleString('ja-JP') + '円' : '値段なし'}</button></div>
          <select data-act="move" data-id="${i.id}" aria-label="ジャンルを移す">${opts(g.id)}</select>
          <button type="button" class="xbtn" data-act="delI" data-id="${i.id}" aria-label="${esc(i.name)}を消す">×</button>
        </div>`).join('')}
      </div>
      <form class="addrow" data-act="addI" data-id="${g.id}">
        <input type="text" placeholder="＋ ${esc(g.name)}に品目を足す" enterkeyhint="done">
        <button type="submit">足す</button>
      </form>
    </section>`).join('');
  h += `<form class="addgenre" data-act="addG"><p>＋ ジャンルを作る</p>
    <div class="addrow" style="margin:0"><input type="text" placeholder="例：玄関、子ども部屋" enterkeyhint="done"><button type="submit">作る</button></div></form>`;
  const d = invDay();
  const days = Array.from({ length: 31 }, (_, k) => `<option value="${k + 1}"${k + 1 === d ? ' selected' : ''}>${k + 1}</option>`).join('');
  h += `<section class="setbox"><h2>棚卸の日</h2>
    <label class="dayrow">毎月<select data-act="day" aria-label="棚卸の日">${days}</select>日</label>
    <p>${d >= 29 ? `${d}日がない月は、月末が棚卸の日になるよ` : 'その日に開くと「今日は棚卸の日！」が出るよ'}</p></section>
    <button type="button" class="reset" data-act="tour">使い方を見る<small>最初に出た説明をもう一回</small></button>`;
  return h;
}

/* トースト（取り消しつき） */
let toastTimer, undoFn = null;
function toast(msg, undo){
  $('toastMsg').textContent = msg; undoFn = undo || null;
  $('toastUndo').hidden = !undo;
  $('toast').classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('toast').classList.remove('show'); undoFn = null; }, 3000);
}
$('toastUndo').onclick = () => { if (undoFn) { undoFn(); save(); render(); } $('toast').classList.remove('show'); undoFn = null; };

/* 操作 */
$('main').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT' || b.tagName === 'FORM') return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'toggle') {
    const [, it] = findItem(id); it.need = !(it.need && !it.bought); it.bought = false;
    b.classList.toggle('need', it.need); save();
    const n = needCount(); $('badge').hidden = n === 0; $('badge').textContent = n;
    return;
  }
  if (act === 'buy') {
    const [, it] = findItem(id); it.bought = true; save();
    (b.closest('.srow') || b).classList.add('gone');
    setTimeout(render, 230);
    toast(`「${it.name}」をカゴへ`, () => { it.bought = false; });
    return;
  }
  if (act === 'unbuy') { const [, it] = findItem(id); it.bought = false; save(); render(); return; }
  if (act === 'tour') { startTour(); return; }
  if (act === 'reset') {
    if (!confirm('今月の棚卸を始める？\n赤くした物と買い物リストが全部まっさらになるよ（品目は消えない）')) return;
    const snap = JSON.stringify(data);
    data.genres.forEach(g => g.items.forEach(i => { i.need = false; i.bought = false; }));
    if (!$('dayBand').hidden) closeBand();
    save(); render(); window.scrollTo(0, 0);
    toast('まっさらにしたよ', () => { data = JSON.parse(snap); });
    return;
  }
  if (act === 'delI') {
    const [g, it] = findItem(id); const idx = g.items.indexOf(it);
    g.items.splice(idx, 1); save(); render();
    toast(`「${it.name}」を消した`, () => { g.items.splice(idx, 0, it); });
    return;
  }
  if (act === 'priceI') {
    const [, it] = findItem(id);
    const v = prompt(`「${it.name}」の値段（円）\n空にすると値段なしになるよ`, it.price ?? '');
    if (v === null) return;
    const t = String(v).normalize('NFKC').replace(/[,，円\s]/g, '');
    if (t === '' || t === '0') { it.price = null; save(); render(); return; }
    if (!/^\d+$/.test(t)) { alert('数字だけで入れてね（例：1480）'); return; }
    it.price = parseInt(t, 10); save(); render();
    return;
  }
  if (act === 'renameI') {
    const [, it] = findItem(id);
    const nm = prompt('品目の名前', it.name); if (nm && nm.trim()) { it.name = nm.trim(); save(); render(); }
    return;
  }
  if (act === 'renameG') {
    const g = data.genres.find(x => x.id === id);
    const nm = prompt('ジャンルの名前', g.name); if (nm && nm.trim()) { g.name = nm.trim(); save(); render(); }
    return;
  }
  if (act === 'delG') {
    const g = data.genres.find(x => x.id === id);
    if (g.items.length && !confirm(`「${g.name}」を消す？\n中の品目${g.items.length}個も一緒に消えるよ`)) return;
    const idx = data.genres.indexOf(g);
    data.genres.splice(idx, 1); save(); render();
    toast(`「${g.name}」を消した`, () => { data.genres.splice(idx, 0, g); });
    return;
  }
});
$('main').addEventListener('toggle', e => {
  if (e.target.classList && e.target.classList.contains('done-list')) doneOpen = e.target.open;
}, true);
$('main').addEventListener('change', e => {
  const s = e.target;
  if (s.dataset.act === 'day') {
    data.settings.day = parseInt(s.value, 10); save(); render(); checkBand();
    toast(`棚卸の日を毎月${invDay()}日にしたよ`);
    return;
  }
  if (s.dataset.act !== 'move') return;
  const [from, it] = findItem(s.dataset.id); const to = data.genres.find(x => x.id === s.value);
  if (!to || to === from) return;
  from.items.splice(from.items.indexOf(it), 1); to.items.push(it); save(); render();
  toast(`「${it.name}」を${to.name}へ移した`);
});
$('main').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, inp = f.querySelector('input'), nm = inp.value.trim(); if (!nm) return;
  if (f.dataset.act === 'addI') {
    data.genres.find(x => x.id === f.dataset.id).items.push({ id: uid(), name: nm, need: false, bought: false, price: null });
  } else if (f.dataset.act === 'addG') {
    data.genres.push({ id: uid(), name: nm, items: [] });
  }
  save(); render();
  const again = document.querySelector(`form[data-id="${f.dataset.id}"] input`) || document.querySelector('form[data-act="addG"] input');
  if (f.dataset.act === 'addI' && again) again.focus();
});

$('editBtn').onclick = () => { editing = !editing; render(); window.scrollTo(0, 0); };
$('tabHome').onclick = () => { view = 'home'; render(); window.scrollTo(0, 0); };
$('tabShop').onclick = () => { view = 'shop'; editing = false; render(); window.scrollTo(0, 0); };

const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
let a2hsSeen = false; try { a2hsSeen = localStorage.getItem('tanaoroshi.a2hs') === '1'; } catch(e){}
if (!standalone && !a2hsSeen) $('a2hs').hidden = false;
$('a2hsClose').onclick = () => { $('a2hs').hidden = true; try { localStorage.setItem('tanaoroshi.a2hs', '1'); } catch(e){} };

/* 今日は棚卸の日！（29〜31日にして、その日がない月は月末）。閉じたらその日のうちは出さない。
   ホーム画面アプリは裏から戻ると読み込み直さないので、開くたびに今日の日付で見直す */
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
function closeBand(){ $('dayBand').hidden = true; try { localStorage.setItem('tanaoroshi.dayband', todayKey()); } catch(e){} }
function checkBand(){
  const d = new Date(), last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  let seen = ''; try { seen = localStorage.getItem('tanaoroshi.dayband') || ''; } catch(e){}
  $('dayBand').hidden = !(d.getDate() === Math.min(invDay(), last) && seen !== todayKey());
}
$('dayBandClose').onclick = closeBand;
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkBand(); });
addEventListener('pageshow', checkBand);
checkBand();

/* 使い方（吹き出し）。見本のデータで見せて、終わったら本物に戻す */
const TOUR = [
  { view: 'home', sel: '#main .item', text: '家にある物を見て、<b>足りない物をタップ</b> → 赤くなる。もう一回タップで戻るよ' },
  { view: 'home', sel: '#tabShop', text: '赤くした物は、下の<b>「買い物リスト」</b>に集まるよ' },
  { view: 'shop', sel: '#main .srow .item', below: true, text: 'お店でカゴに入れたら<b>品目をタップ</b> → リストから消える。まちがえても「取り消し」で戻せるよ' },
  { view: 'shop', sel: '#main .spr', below: true, text: '右の<b>値段をタップ</b>で直せる。上の「残り／合計」も一緒に変わるよ' },
  { view: 'home', sel: '#editBtn', text: '品目の名前・値段を変える、足す、消すはここ。<b>棚卸の日</b>と<b>使い方</b>も、この中のいちばん下にあるよ' },
  { view: 'home', sel: '#main .reset', text: '棚卸の日になったらこれ。<b>赤と買い物リストがまっさら</b>になるから、また足りない物をタップしてね' },
];
function startTour(){
  if (tour) return;
  try { localStorage.setItem('tanaoroshi.tour', '1'); } catch(e){}
  const demo = JSON.parse(JSON.stringify(data));
  const first = demo.genres.flatMap(g => g.items)[0];
  if (first) { first.need = true; first.bought = false; } // 買い物リストが空でも指す先があるように
  $('toast').classList.remove('show'); undoFn = null;
  tour = { i: 0, real: data, el: null, back: { view, editing } };
  data = demo; editing = false;
  $('tour').hidden = false;
  showStep();
}
function endTour(){
  const back = tour.back;
  data = tour.real; tour = null;
  $('tour').hidden = true;
  view = back.view; editing = back.editing; render(); // 始めた画面に戻る（編集画面の「使い方を見る」なら編集画面のいちばん下）
  if (editing) window.scrollTo(0, document.body.scrollHeight); else window.scrollTo(0, 0);
}
function showStep(){
  const st = TOUR[tour.i];
  if (view !== st.view) { view = st.view; window.scrollTo(0, 0); }
  editing = false; render();
  const el = document.querySelector(st.sel);
  if (el && $('main').contains(el)) el.scrollIntoView({ block: 'center' });
  tour.el = el;
  $('tourText').innerHTML = st.text;
  $('tourNum').textContent = `${tour.i + 1} / ${TOUR.length}`;
  $('tourNext').textContent = tour.i === TOUR.length - 1 ? 'おわり' : '次へ';
  placeTour();
}
function placeTour(){
  if (!tour) return;
  const spot = $('tourSpot'), box = $('tourBox'), vw = innerWidth, vh = innerHeight, pad = 6, gap = 14;
  const bw = Math.min(340, vw - 32);
  box.style.width = bw + 'px';
  const r = tour.el && tour.el.getBoundingClientRect();
  if (!r || !r.width) { // 指す先がないときは真ん中に出す
    Object.assign(spot.style, { left: vw / 2 + 'px', top: vh / 2 + 'px', width: '0px', height: '0px' });
    box.className = 'tour-box mid';
    Object.assign(box.style, { left: (vw - bw) / 2 + 'px', top: Math.max(16, (vh - box.offsetHeight) / 2) + 'px' });
    return;
  }
  Object.assign(spot.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
  const left = Math.max(16, Math.min(r.left + r.width / 2 - bw / 2, vw - 16 - bw));
  const bh = box.offsetHeight;
  let below = TOUR[tour.i].below || r.top + r.height / 2 < vh / 2; // お店の2枚は上の「残り／合計」を隠さないよう下に出す
  if (below && r.bottom + pad + gap + bh > vh - 8) below = false; // 下にはみ出すなら上へ
  box.className = 'tour-box ' + (below ? 'up' : 'down');
  box.style.left = left + 'px';
  box.style.top = (below ? r.bottom + pad + gap : r.top - pad - gap - bh) + 'px';
  box.style.setProperty('--ax', Math.max(20, Math.min(r.left + r.width / 2 - left, bw - 20)) + 'px');
}
$('tourNext').onclick = () => { if (tour.i < TOUR.length - 1) { tour.i++; showStep(); } else endTour(); };
$('tourSkip').onclick = endTour;
$('tour').addEventListener('touchmove', e => e.preventDefault(), { passive: false });
addEventListener('resize', placeTour);
addEventListener('scroll', placeTour, { passive: true });

render();
let tourSeen = false; try { tourSeen = localStorage.getItem('tanaoroshi.tour') === '1'; } catch(e){}
if (!tourSeen) setTimeout(() => { if (!$('toast').classList.contains('show')) startTour(); }, 400);
</script>
